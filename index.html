    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What does AI Integ do?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "AI Integ implements AI systems for professional services firms. We do not advise on strategy. We build, test, and hand over running systems with named accountability. Fixed-scope delivery from discovery through production handover."
            }
          },
          {
            "@type": "Question",
            "name": "How long does a typical engagement take?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Discovery takes two weeks. Build engagements are scoped individually — typically 6 to 12 weeks for a focused use case. We deliver working software, not strategy decks."
            }
          },
          {
            "@type": "Question",
            "name": "What happens after delivery?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We hand over running systems with documentation, training, and one named person accountable for the outcome. We do not disappear. If it doesn't run in production, we haven't finished."
            }
          },
          {
            "@type": "Question",
            "name": "Who owns the code and the AI models?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You own the code we write for you. AI models depend on the platform you choose — we help you select models that match your data governance, security, and compliance requirements."
            }
          },
          {
            "@type": "Question",
            "name": "Do you build custom AI models?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We build AI systems using your existing platforms or by selecting the right model for your use case. We do not sell model training as a standalone service — we deliver outcomes."
            }
          }
        ]
      }
    </script>

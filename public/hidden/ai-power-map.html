        // Star Renderer helper
        function renderStars(rating) {
            let starsHtml = '';
            const fullStars = Math.floor(rating);
            const hasHalf = rating % 1 !== 0;
            for(let i=0; i<5; i++) {
                if (i < fullStars) {
                    starsHtml += '<i class="fas fa-star mr-0.5"></i>';
                } else if (i === fullStars && hasHalf) {
                    starsHtml += '<i class="fas fa-star-half-alt mr-0.5"></i>';
                } else {
                    starsHtml += '<i class="far fa-star mr-0.5"></i>';
                }
            }
            return starsHtml + ` <span class="text-xs text-gray-400 font-normal ml-1">(${rating})</span>`;
        }
        // Render Cards to DOM
        function renderCards(filter = 'all') {
            const grid = document.getElementById('tools-grid');
            grid.innerHTML = '';

            let filteredTools = filter === 'all' ? [...toolsData] : toolsData.filter(t => t.category === filter);

            // Within a single category, rank by rating so the top 5 surface first.
            // This stays meaningful even as future research runs add more than 5 per category.
            if (filter !== 'all') {
                filteredTools = filteredTools.sort((a, b) => b.stars - a.stars);
            }

            filteredTools.forEach((tool, index) => {
                const rank = index + 1;
                const showRankBadge = filter !== 'all' && rank <= 5;
                const card = document.createElement('div');
                card.className = "relative bg-gray-900 border border-gray-800 rounded-xl p-5 hover:border-cyan-500 transition-all duration-300 transform hover:-translate-y-1 flex flex-col justify-between shadow-lg";
                card.innerHTML = `
                    ${showRankBadge ? `<span class="absolute -top-2 -right-2 w-7 h-7 flex items-center justify-center rounded-full text-xs font-bold ${rank === 1 ? 'bg-amber-400 text-gray-900' : 'bg-gray-800 text-cyan-300 border border-cyan-700'}">${rank}</span>` : ''}
                    <div>
                        <div class="flex justify-between items-start mb-3">
                            <div class="p-3 bg-gray-950 rounded-lg text-cyan-400 text-xl border border-gray-800">
                                <i class="${tool.icon}"></i>
                            </div>
                            <span class="text-xs px-2 py-1 rounded-full font-semibold bg-gray-950 text-gray-400 border border-gray-800">${tool.categoryLabel}</span>
                        </div>
                        <h3 class="text-lg font-bold text-white mb-2">${tool.name}${rank === 1 && filter !== 'all' ? ' <span class=\"text-amber-400 text-xs align-middle\">★ Top Pick</span>' : ''}</h3>
                        <p class="text-gray-400 text-sm mb-4 line-clamp-3">${tool.shortDesc}</p>
                    </div>
                    <div>
                        <div class="flex items-center text-amber-400 text-xs mb-4">
                            ${renderStars(tool.stars)}
                        </div>
                        <div class="flex gap-2">
                            <button onclick="openModal('${tool.id}')" class="flex-1 text-center py-2 bg-gray-800 hover:bg-gray-700 text-white rounded-lg text-xs font-semibold tracking-wide transition">
                                Inspect Details
                            </button>
                            <a href="${tool.url}" target="_blank" class="px-3 py-2 bg-cyan-950 hover:bg-cyan-900 text-cyan-400 rounded-lg text-xs border border-cyan-800 transition flex items-center justify-center">
                                <i class="fas fa-external-link-alt"></i>
                            </a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
        // Handle Category Filtering Toggle Buttons
        function filterCategory(category) {
            const container = document.getElementById('filter-container');
            const buttons = container.getElementsByTagName('button');
            for (let btn of buttons) {
                btn.className = "px-3 py-1.5 rounded-lg text-sm font-medium bg-gray-800 text-gray-300 hover:bg-gray-700 transition";
            }
            document.getElementById(`btn-${category}`).className = "px-3 py-1.5 rounded-lg text-sm font-medium bg-cyan-600 text-white transition";
            renderCards(category);
        }
        // Modal Controls
        function openModal(id) {
            const tool = toolsData.find(t => t.id === id);
            if(!tool) return;
            document.getElementById('modal-title').innerText = tool.name;
            document.getElementById('modal-badge').innerText = tool.categoryLabel;
            document.getElementById('modal-desc').innerText = tool.longDesc;
            document.getElementById('modal-stars').innerHTML = renderStars(tool.stars);
            document.getElementById('modal-cost').innerText = tool.cost;
            document.getElementById('modal-caveats').innerText = tool.caveats;
            document.getElementById('modal-review').innerText = tool.review;
            document.getElementById('modal-link').href = tool.url;

            const iconContainer = document.getElementById('modal-icon');
            iconContainer.className = `text-3xl text-cyan-400 ${tool.icon}`;
            const modal = document.getElementById('detail-modal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
        }
        function closeModal() {
            const modal = document.getElementById('detail-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }
        // Escape Key Modal Dismissal
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });
        // Initialize App View
        renderCards();
    </script>
